name: phils_brain_app
description: "Phil's Brain — syntopical essays, the knowledge graph, praxis and cognitive tools. Reads the shared Phils Library database."
publish_to: 'none'
version: 1.1.0+2

environment:
  # share_plus 13 requires Dart >=3.10 (and Flutter >=3.38.1), so the app can no
  # longer honestly claim to build on 3.3 — raised to match reality.
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  share_plus: ^13.3.0
  webview_flutter: ^4.8.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# jni 1.0.1 ships a broken android/build.gradle (calls kotlin() unavailable
# in that project) - pin until upstream fixes it.
dependency_overrides:
  jni: 1.0.0
